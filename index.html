<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MoonTech Monthly Model</title>
<meta name="description" content="MoonTech monthly model dashboard: revenue, ARR, retention and unit economics for Legacy and ROAS clients, rebuilt each month from the raw extracts.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Inter+Tight:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F3F1EC; --paper-2:#EAE7E0; --paper-3:#E1DDD4; --card:#FFFFFF;
  --ink:#1F1D1A; --ink-2:#47443F; --ink-3:#847F77; --ink-4:#B0ABA2;
  --rule:rgba(31,29,26,.13); --rule-2:rgba(31,29,26,.06);
  --coral:#E8401C; --coral-wash:rgba(232,64,28,.09); --teal:#1296AE; --teal-wash:rgba(18,150,174,.10);
  --indigo:#6257C9; --green:#1F8A52; --ochre:#B07218; --violet:#6257C9; --grey:#938E86; --grey-2:#D6D1C8;
  --deep:#C4330F; --block:#E8401C; --block-text:#FFFFFF;
  --c-legacy:var(--teal); --c-roas:var(--coral); --c-other:var(--grey); --c-plug:var(--grey-2);
  --good:#1F8A52; --warn:#B07218; --bad:#C0392B;
  --radius:4px; --shadow:none;
}
:root:not([data-theme="light"]){ color-scheme: light; }
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#1C1A18; --paper-2:#232120; --paper-3:#2B2826; --card:#232120;
  --ink:#F4F1EC; --ink-2:#D4D0C9; --ink-3:#938E86; --ink-4:#65605A;
  --rule:rgba(244,241,236,.14); --rule-2:rgba(244,241,236,.07);
  --coral:#F2552E; --coral-wash:rgba(242,85,46,.16); --teal:#2BAEC4; --teal-wash:rgba(43,174,196,.16);
  --indigo:#8A80E8; --green:#3DB172; --ochre:#D08A2A; --violet:#8A80E8; --grey:#938E86; --grey-2:#4A463F;
  --deep:#F2552E; --block:#E8401C; --block-text:#FFFFFF;
  --good:#3DB172; --bad:#E06A5F; color-scheme:dark; }}
:root[data-theme="dark"]{
  --paper:#1C1A18; --paper-2:#232120; --paper-3:#2B2826; --card:#232120;
  --ink:#F4F1EC; --ink-2:#D4D0C9; --ink-3:#938E86; --ink-4:#65605A;
  --rule:rgba(244,241,236,.14); --rule-2:rgba(244,241,236,.07);
  --coral:#F2552E; --coral-wash:rgba(242,85,46,.16); --teal:#2BAEC4; --teal-wash:rgba(43,174,196,.16);
  --indigo:#8A80E8; --green:#3DB172; --ochre:#D08A2A; --violet:#8A80E8; --grey:#938E86; --grey-2:#4A463F;
  --deep:#F2552E; --block:#E8401C; --block-text:#FFFFFF;
  --good:#3DB172; --bad:#E06A5F; color-scheme:dark; }

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased;font-feature-settings:"tnum" 1,"cv11" 1}
a{color:inherit}
.wrap{max-width:1320px;margin:0 auto;padding:0 20px}
@media (max-width:640px){.wrap{padding:0 16px}}

/* ---- header */
header.top{border-bottom:1px solid var(--rule);background:var(--paper);position:sticky;top:0;z-index:20}
.topbar{display:flex;align-items:center;gap:18px;height:64px}
.brand{display:flex;align-items:center;gap:14px;min-width:0}
.brand img{height:30px;width:auto;display:block}
.brand .logo-ink{display:block}.brand .logo-paper{display:none}
:root[data-theme="dark"] .brand .logo-ink{display:none}:root[data-theme="dark"] .brand .logo-paper{display:block}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .brand .logo-ink{display:none}:root:not([data-theme="light"]) .brand .logo-paper{display:block}}
.brand .sep{width:1px;height:28px;background:var(--rule)}
.brand .title{font-family:"Inter Tight",Inter,sans-serif;font-weight:600;font-size:15px;letter-spacing:.01em;white-space:nowrap}
.brand .title small{display:block;font-family:Inter;font-weight:500;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}
.spacer{flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);border:1px solid var(--rule);padding:5px 9px;border-radius:999px;white-space:nowrap}
.pill b{color:var(--ink);font-weight:600;letter-spacing:.02em;text-transform:none;font-size:12px}
.pill .dot{width:7px;height:7px;border-radius:50%;background:var(--coral)}
.iconbtn{border:1px solid var(--rule);background:transparent;color:var(--ink);width:34px;height:34px;border-radius:999px;cursor:pointer;display:grid;place-items:center}
.iconbtn:hover{background:var(--paper-2)}

nav.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;border-top:1px solid var(--rule-2)}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{appearance:none;border:0;background:transparent;color:var(--ink-3);font:inherit;font-weight:500;font-size:13px;padding:12px 14px 11px;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;letter-spacing:.01em}
nav.tabs button:hover{color:var(--ink)}
nav.tabs button.active{color:var(--ink);border-bottom-color:var(--coral)}
nav.tabs button .n{font-size:10px;color:var(--ink-4);margin-right:6px;letter-spacing:.08em}

/* ---- controls */
.controls{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;padding:14px 0 6px}
.ctl{display:flex;align-items:center;gap:8px}
.ctl label{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);white-space:nowrap}
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:var(--radius);overflow:hidden}
.seg button{appearance:none;border:0;background:transparent;color:var(--ink-2);font:inherit;font-size:12.5px;font-weight:500;padding:6px 11px;cursor:pointer;border-right:1px solid var(--rule-2)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--ink);color:var(--paper)}
.seg button:hover:not(.on){background:var(--paper-2)}
select.sel{appearance:none;border:1px solid var(--rule);background:var(--paper) url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6'><path d='M0 0l5 6 5-6z' fill='%237A7E84'/></svg>") no-repeat right 10px center;color:var(--ink);font:inherit;font-size:12.5px;font-weight:500;padding:6px 28px 6px 10px;border-radius:var(--radius);cursor:pointer}
.flagbar{display:flex;flex-wrap:wrap;gap:8px;padding:6px 0 14px}
.flag{display:inline-flex;align-items:center;gap:6px;font-size:11px;color:var(--ink-2);border:1px solid var(--rule);border-radius:3px;padding:3px 8px;background:var(--card)}
.flag.coral{border-color:var(--coral);color:var(--coral)}
.flag.teal{border-color:var(--teal);color:var(--teal)}
.flag i{font-style:normal;font-weight:700}

/* ---- layout primitives */
section.page{display:none;padding-bottom:60px}
section.page.active{display:block}
section[data-view="co"] .seg-only{display:none!important}
section[data-view="co"] table.t tr.sub,section[data-view="co"] table.t tr.sub2{display:none}
.viewnote{font-size:12px;color:var(--text-3);margin:-4px 0 10px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g32{grid-template-columns:minmax(0,3fr) minmax(0,2fr)}.g23{grid-template-columns:minmax(0,2fr) minmax(0,3fr)}
@media (max-width:1000px){.g3,.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g32,.g23{grid-template-columns:1fr}}
@media (max-width:640px){.g2,.g3,.g4{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--rule);border-radius:var(--radius);padding:18px 20px;min-width:0}
.card.block{background:var(--block);color:var(--block-text);border-color:var(--block);position:relative;overflow:hidden}.card.block::after{content:'';position:absolute;right:-28px;bottom:-30px;width:170px;height:170px;background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 200'><path fill='rgba(255,255,255,0.12)' d='M150 20c-8 22-30 28-44 44-12 14-14 34-6 50 2 4 0 8-4 8-18 2-36-6-46-22-12-20-8-48 10-64 16-14 56-22 90-16zM96 108c10-14 28-20 44-20 4 0 6 4 4 8-8 16-24 28-42 30-6 0-10-12-6-18z'/></svg>") no-repeat center/contain;pointer-events:none}.card.block>*{position:relative;z-index:1}
.card.block .eyebrow{color:rgba(255,255,255,.72)}
.card.block .muted{color:rgba(255,255,255,.72)}
.card.block .hairline{border-color:rgba(238,236,231,.14)}
.eyebrow{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2);font-weight:600;margin:0 0 6px}
.h2{font-family:"Inter Tight",Inter,sans-serif;font-size:20px;font-weight:600;letter-spacing:-.005em;margin:0 0 4px}
.h3{font-family:"Inter Tight",Inter,sans-serif;font-size:15px;font-weight:700;margin:0 0 2px}
.muted{color:var(--ink-3)}
.small{font-size:12px}
.hairline{border-top:1px solid var(--rule);margin:14px 0}
.pagehead{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin:8px 0 18px;flex-wrap:wrap}
.pagehead p{margin:4px 0 0;max-width:720px;color:var(--ink-2)}
.hero{font-family:"Inter Tight",Inter,sans-serif;font-size:44px;font-weight:600;letter-spacing:-.02em;line-height:1;margin:6px 0 4px;font-variant-numeric:tabular-nums}
.hero.sm{font-size:30px}
.delta{font-size:12px;font-weight:600}
.delta.up{color:var(--good)}
.card.block .delta.up,.card.block .delta.down,.card.block .delta.flat{color:rgba(255,255,255,.92)}.delta.down{color:var(--bad)}.delta.flat{color:var(--ink-3)}
.split{display:flex;gap:14px;margin-top:10px;flex-wrap:wrap}
.split .it{display:flex;align-items:baseline;gap:7px;font-size:12.5px}
.split .it .k{color:var(--ink-3)}
.split .it b{font-weight:600}
.card.block .split .it .k{color:rgba(255,255,255,.72)}
.card.block .sw.legacy,.card.block .sw.roas{outline:1px solid rgba(255,255,255,.5)}
.sw{display:inline-block;width:9px;height:9px;border-radius:2px;vertical-align:-1px;margin-right:6px}
.sw.legacy{background:var(--c-legacy)}.sw.roas{background:var(--c-roas)}.sw.other{background:var(--c-other)}.sw.plug{background:var(--c-plug)}
.sw.ent{background:var(--teal)}.sw.gro{background:var(--ochre)}.sw.sme{background:var(--violet)}
.sw.s{background:var(--ochre)}.sw.m{background:var(--coral)}.sw.l{background:var(--deep)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--ink-2);margin-top:8px}
.tag{display:inline-block;font-size:10px;letter-spacing:.08em;text-transform:uppercase;padding:2px 6px;border-radius:3px;border:1px solid var(--rule);color:var(--ink-3);margin-left:6px;vertical-align:middle;font-weight:600}
.tag.coral{color:var(--coral);border-color:var(--coral)}
.tag.warn{color:var(--ochre);border-color:var(--ochre)}
.tag.ok{color:var(--good);border-color:var(--good)}
.note{font-size:12px;color:var(--ink-3);margin-top:10px;line-height:1.5}
.note b{color:var(--ink-2)}

/* ---- tables */
.tblwrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.t{width:100%;border-collapse:separate;border-spacing:0;font-size:13px;font-variant-numeric:tabular-nums}
table.t th,table.t td{padding:7px 10px;text-align:right;border-bottom:1px solid var(--rule-2);white-space:nowrap;vertical-align:middle}
table.t th{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);font-weight:600;border-bottom:1px solid var(--rule)}
table.t th:first-child,table.t td:first-child{text-align:left;position:sticky;left:0;background:var(--card);z-index:1;white-space:normal;min-width:260px;max-width:360px}
table.t tr.sec td{padding-top:16px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--coral);font-weight:700;border-bottom:1px solid var(--rule)}
table.t tr.tot td{font-weight:600;border-top:1px solid var(--rule)}
table.t tr.sub td:first-child{padding-left:24px;color:var(--ink-2)}
table.t tr.sub2 td:first-child{padding-left:38px;color:var(--ink-3)}
table.t tr.sub td,table.t tr.sub2 td{color:var(--ink-2)}
table.t td.na{color:var(--ink-4)}
table.t td .f,table.t th .f{font-size:9px;color:var(--coral);margin-left:3px;vertical-align:super;font-weight:700}
table.t tbody tr:hover td{background:var(--paper-2)}
table.t th.now,table.t td.now{background:var(--teal-wash)}
table.t.dense th,table.t.dense td{padding:5px 8px;font-size:12px}
table.t.fit th:first-child,table.t.fit td:first-child{min-width:0}
.neg{color:var(--bad)}
.pos{color:var(--good)}
.defs{font-size:12px;color:var(--ink-2);line-height:1.55;columns:2;column-gap:28px}
@media (max-width:800px){.defs{columns:1}}
.defs p{margin:0 0 8px;break-inside:avoid}
.defs b{color:var(--ink)}

/* ---- charts */
.chart{position:relative;width:100%}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart text{font-family:Inter,system-ui,sans-serif;fill:var(--ink-3);font-size:10.5px}
.chart .grid line{stroke:var(--rule-2);stroke-width:1}
.chart .axis line{stroke:var(--rule);stroke-width:1}
.chart .hit{fill:transparent}
.chart .hit:hover{fill:var(--rule-2)}
.tip{position:fixed;pointer-events:none;background:var(--ink);color:var(--paper);font-size:12px;padding:8px 10px;border-radius:4px;z-index:50;display:none;max-width:260px;line-height:1.4;box-shadow:0 6px 24px rgba(0,0,0,.18)}
.tip .t{font-weight:600;margin-bottom:3px}
.tip .r{display:flex;justify-content:space-between;gap:14px}
.tip .r span:first-child{opacity:.75}
.cohort{display:grid;gap:2px;font-size:11px}
.cohort .cell{height:26px;display:grid;place-items:center;border-radius:2px;color:var(--ink);font-weight:500}
.cohort .lab{display:flex;align-items:center;justify-content:flex-start;padding-left:4px;color:var(--ink-2);white-space:nowrap}
.cohort .hd{display:grid;place-items:center;color:var(--ink-3);font-size:10px;letter-spacing:.06em}

/* ---- horizontal bars */
.hbars{display:grid;gap:6px;margin-top:10px}
.hb{display:grid;grid-template-columns:130px 1fr 52px;align-items:center;gap:10px;font-size:12px}
.hb .n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink-2)}
.hb .bar{height:12px;background:var(--paper-2);border-radius:2px;overflow:hidden}
.hb .bar i{display:block;height:100%;background:var(--c-legacy);border-radius:0 2px 2px 0}
.hb .v{text-align:right;font-variant-numeric:tabular-nums}
/* ---- control page */
.switch{display:inline-flex;align-items:center;gap:8px;cursor:pointer;user-select:none}
.switch .tr{width:34px;height:18px;border-radius:999px;background:var(--grey-2);position:relative;transition:.15s}
.switch .tr::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#fff;transition:.15s}
.switch.on .tr{background:var(--coral)}
.switch.on .tr::after{left:18px}
.btn{appearance:none;border:1px solid var(--ink);background:var(--ink);color:var(--paper);font:inherit;font-size:12.5px;font-weight:600;padding:8px 14px;border-radius:var(--radius);cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink)}
.btn:hover{opacity:.9}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 18px;font-size:12.5px}
.kv dt{color:var(--ink-3)}.kv dd{margin:0}
.statrow{display:flex;gap:28px;flex-wrap:wrap}
.statrow .st .v{font-family:"Inter Tight",Inter,sans-serif;font-size:22px;font-weight:600;letter-spacing:-.01em}
.statrow .st .k{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
ul.plain{margin:6px 0 0;padding-left:18px;font-size:12.5px;color:var(--ink-2)}
ul.plain li{margin:3px 0}
.loading{padding:80px 0;text-align:center;color:var(--ink-3)}
footer{border-top:1px solid var(--rule);padding:18px 0 40px;font-size:11.5px;color:var(--ink-3);display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px}
.ok{color:var(--good)}
</style>
</head>

<header class="top">
  <div class="wrap">
    <div class="topbar">

/* ============================================================ formatting */
const fmt = {
  money(v, d) { if (v == null || isNaN(v)) return '—'; const a = Math.abs(v), s = v < 0 ? '−' : '';
    if (a >= 1e6) return s + '$' + (a / 1e6).toFixed(d == null ? 2 : d) + 'M';
    if (a >= 1e4) return s + '$' + (a / 1e3).toFixed(d == null ? 0 : d) + 'k';
    if (a >= 1e3) return s + '$' + (a / 1e3).toFixed(d == null ? 1 : d) + 'k';
    return s + '$' + a.toFixed(d == null ? 0 : d); },
  moneyFull(v) { if (v == null) return '—'; return (v < 0 ? '−' : '') + '$' + Math.round(Math.abs(v)).toLocaleString(); },
  pct(v, d = 1) { if (v == null || isNaN(v)) return '—'; return (v * 100).toFixed(d) + '%'; },
  pctS(v, d = 1) { if (v == null || isNaN(v)) return '—'; return (v > 0 ? '+' : v < 0 ? '−' : '') + (Math.abs(v) * 100).toFixed(d) + '%'; },
  num(v, d = 0) { if (v == null || isNaN(v)) return '—'; const a = Math.abs(v); if (a >= 1e6) return (v / 1e6).toFixed(1) + 'M'; if (a >= 1e4) return (v / 1e3).toFixed(1) + 'k'; return v.toLocaleString(undefined, { maximumFractionDigits: d, minimumFractionDigits: d }); },
  int(v) { if (v == null || isNaN(v)) return '—'; const r = Math.round(v); return (r === 0 ? 0 : r).toLocaleString(); },
  x(v) { if (v == null || isNaN(v)) return '—'; return v.toFixed(1) + 'x'; },
  mo(v) { if (v == null || isNaN(v)) return '—'; return v.toFixed(v >= 10 ? 0 : 1) + ' mo'; },
  month(m) { if (!m) return '—'; const [y, mm] = m.split('-'); return ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'][+mm - 1] + '-' + y.slice(2); },
  monthLong(m) { if (!m) return '—'; const [y, mm] = m.split('-'); return ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'][+mm - 1] + ' ' + y; }

/* ============================================================ P&L with capitalisation switches */
function devExpensed(k) { const m = S.months[k], y = m.slice(0, 4), mm = +m.slice(5); const s = state.cap[y] || 'Expensed';
  if (s === 'Expensed') return true; if (s === 'Capitalised') return false; return mm >= 7; /* Split: H1 cap, H2 exp */ }
function plFor(ks) { // aggregated P&L in USD for month indices ks, with capitalisation applied
  const pl = S.pl, g = n => sum(ks.map(k => pl[n][k]));
  const devE = sum(ks.map(k => devExpensed(k) ? pl.development[k] : 0)), devC = g('development') - devE;
  const rev = g('sales'), cp = g('creator_payouts'), cos = g('cos_total'), opexX = g('opex_ex_dev');
  const o = { rev, cp, materials: g('materials'), freelancers: g('freelancers'), other_cos: g('other_cos'), cos, cm: rev - cp, gp: rev - cos,
    opex_marketing: g('opex_marketing'), opex_staff: g('opex_staff'), opex_tech: g('opex_technology') + devE, opex_ga: g('opex_ga'), devE, devC,
    opexX, opex: opexX + devE, da: g('da'), fin: g('finance_cost'), tax: g('tax'), tp: g('transfer_pricing') };
  o.ebitda = o.gp - o.opex; o.ebitda_x = o.gp - o.opexX; o.ebit = o.ebitda - o.da; o.np = o.ebit - o.fin - o.tax; o.np_tp = o.np - o.tp;
  o.cm_pct = rev ? o.cm / rev : null; o.gm_pct = rev ? o.gp / rev : null; o.ebitda_pct = rev ? o.ebitda / rev : null; o.np_pct = rev ? o.np_tp / rev : null;
  return o;
}
function ksOf(p) { const a = kOf(p.start), b = kOf(p.end); const r = []; for (let k = a; k <= b; k++) r.push(k); return r; }
function pPL(p) { return plFor(ksOf(p)); }
function annualisedPL() { // 10.19 annualised with capitalisation setting of 2026
  const A = D.annualised, y = M.latest_month.slice(0, 4), expensed = (state.cap[y] || 'Expensed') === 'Expensed';
  const rev = A.total, cos = A.creator_payouts + A.materials + A.freelancers + A.other_cos, devE = expensed ? A.development : 0;
  const o = { rev, cp: A.creator_payouts, cos, cm: rev - A.creator_payouts, gp: rev - cos, opexX: A.opex_ex_dev, devE, devC: expensed ? 0 : A.development,
    opex: A.opex_ex_dev + devE, da: A.da, fin: A.finance_cost, tax: A.tax, tp: A.transfer_pricing, opex_marketing: A.opex_marketing, opex_staff: A.opex_staff, opex_tech: A.opex_technology + devE, opex_ga: A.opex_ga };
  o.ebitda = o.gp - o.opex; o.ebitda_x = o.gp - o.opexX; o.ebit = o.ebitda - o.da; o.np = o.ebit - o.fin - o.tax; o.np_tp = o.np - o.tp;
  o.cm_pct = o.cm / rev; o.gm_pct = o.gp / rev; o.ebitda_pct = o.ebitda / rev; o.np_pct = o.np_tp / rev; return o;
}

/* ============================================================ charts (inline SVG) */
const tipEl = document.getElementById('tip');
function showTip(e, html) { tipEl.innerHTML = html; tipEl.style.display = 'block'; moveTip(e); }
function moveTip(e) { const w = tipEl.offsetWidth, hh = tipEl.offsetHeight; let x = e.clientX + 14, y = e.clientY + 14; if (x + w > innerWidth - 8) x = e.clientX - w - 14; if (y + hh > innerHeight - 8) y = e.clientY - hh - 14; tipEl.style.left = x + 'px'; tipEl.style.top = y + 'px'; }
function hideTip() { tipEl.style.display = 'none'; }
function niceMax(v) { if (v <= 0) return 1; const p = Math.pow(10, Math.floor(Math.log10(v))); const n = v / p; const m = n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10; return m * p; }
function tickFmt(v, kind) { if (kind === 'pct') return Math.round(v * 100) + '%'; if (kind === 'num') return fmt.num(v); return fmt.money(v, 0); }

// stacked / grouped bars + optional lines; x = categorical labels
function barChart(el, cfg) {
  const { labels, series, lines = [], kind = 'money', height = 220, stacked = true, labelEvery = 3, minVal } = cfg;
  const W = 720, H = height, pl = 46, pr = 12, pt = 12, pb = 26, iw = W - pl - pr, ih = H - pt - pb, n = labels.length;
  let mx = 0, mn = 0;
  for (let i = 0; i < n; i++) { let pos = 0, neg = 0; series.forEach(s => { const v = s.values[i] || 0; if (stacked) { v >= 0 ? pos += v : neg += v; } else { mx = Math.max(mx, v); mn = Math.min(mn, v); } }); if (stacked) { mx = Math.max(mx, pos); mn = Math.min(mn, neg); } }
  lines.forEach(l => l.values.forEach(v => { if (v != null) { mx = Math.max(mx, v); mn = Math.min(mn, v); } }));
  if (minVal != null) mn = Math.min(mn, minVal);
  mx = niceMax(mx); mn = mn < 0 ? -niceMax(-mn) : 0;
  const y = v => pt + ih - (v - mn) / (mx - mn) * ih, bw = iw / n, barW = Math.min(24, bw * 0.62);
  let g = `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="aspect-ratio:${W}/${H}">`;
  const ticks = 4; g += '<g class="grid">';
  for (let t = 0; t <= ticks; t++) { const v = mn + (mx - mn) * t / ticks, yy = y(v); g += `<line x1="${pl}" x2="${W - pr}" y1="${yy}" y2="${yy}"/><text x="${pl - 6}" y="${yy + 3.5}" text-anchor="end">${tickFmt(v, kind)}</text>`; }
  g += '</g>';
  for (let i = 0; i < n; i++) {
    const cx = pl + bw * i + bw / 2; let pos = 0, neg = 0;
    series.forEach((s, si) => { const v = s.values[i] || 0; if (!v) return; let y0, y1;
      if (stacked) { if (v >= 0) { y0 = y(pos + v); y1 = y(pos); pos += v; } else { y0 = y(neg); y1 = y(neg + v); neg += v; } }
      else { y0 = y(Math.max(0, v)); y1 = y(Math.min(0, v)); }
      const x = stacked ? cx - barW / 2 : cx - barW / 2 + (si - (series.length - 1) / 2) * (barW / series.length); const w = stacked ? barW : barW / series.length;
      const hgt = Math.max(0, y1 - y0 - 2);
      g += `<rect x="${x}" y="${y0 + (v >= 0 ? 0 : 2)}" width="${w}" height="${hgt}" fill="${s.color}" rx="${v > 0 && pos === v + (pos - v) ? 0 : 0}"/>`; });
    if (i % labelEvery === 0 || n <= 14) g += `<text x="${cx}" y="${H - 8}" text-anchor="middle">${labels[i]}</text>`;
  }
  lines.forEach(l => { let d = ''; l.values.forEach((v, i) => { if (v == null) return; const cx = pl + bw * i + bw / 2; d += (d ? 'L' : 'M') + cx + ',' + y(v); }); g += `<path d="${d}" fill="none" stroke="${l.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"${l.dash ? ' stroke-dasharray="4 4"' : ''}/>`;
    const li = l.values.map((v, i) => v == null ? -1 : i).filter(i => i >= 0).pop(); if (li != null && li >= 0) g += `<circle cx="${pl + bw * li + bw / 2}" cy="${y(l.values[li])}" r="4" fill="${l.color}" stroke="var(--card)" stroke-width="2"/>`; });
  g += `<g class="axis"><line x1="${pl}" x2="${W - pr}" y1="${y(0)}" y2="${y(0)}"/></g>`;
  for (let i = 0; i < n; i++) g += `<rect class="hit" data-i="${i}" x="${pl + bw * i}" y="${pt}" width="${bw}" height="${ih}"/>`;
  g += '</svg>'; el.innerHTML = g;
  const all = [...series, ...lines];
  el.querySelectorAll('.hit').forEach(r => { r.addEventListener('mousemove', e => { const i = +r.dataset.i; showTip(e, `<div class="t">${cfg.fullLabels ? cfg.fullLabels[i] : labels[i]}</div>` + all.map(s => s.values[i] == null ? '' : `<div class="r"><span>${s.name}</span><span>${kind === 'pct' ? fmt.pct(s.values[i]) : kind === 'num' ? fmt.int(s.values[i]) : fmt.money(s.values[i], 1)}</span></div>`).join('')); }); r.addEventListener('mouseleave', hideTip); });
}
function lineChart(el, cfg) { barChart(el, Object.assign({ series: [] }, cfg, { lines: cfg.series, series: [] })); }
function sparkline(values, color = 'var(--coral)', w = 90, hh = 26) {
  const v = values.filter(x => x != null); if (v.length < 2) return ''; const mx = Math.max(...v), mn = Math.min(...v); const n = values.length;
  let d = ''; values.forEach((x, i) => { if (x == null) return; const px = i / (n - 1) * w, py = hh - 2 - (mx === mn ? .5 : (x - mn) / (mx - mn)) * (hh - 4); d += (d ? 'L' : 'M') + px.toFixed(1) + ',' + py.toFixed(1); });
  return `<svg width="${w}" height="${hh}" viewBox="0 0 ${w} ${hh}" style="overflow:visible;vertical-align:middle"><path d="${d}" fill="none" stroke="${color}" stroke-width="1.5" stroke-linejoin="round"/></svg>`;
}
function cohortGrid(el, rows, maxCols, label0 = 'M0') {
  const cols = Math.min(maxCols, Math.max(...rows.map(r => r.cells.length)));
  let g = `<div class="cohort" style="grid-template-columns:minmax(110px,auto) 44px repeat(${cols},minmax(34px,1fr))">`;
  g += `<div class="hd" style="justify-self:start">Cohort</div><div class="hd">n</div>`; for (let c = 0; c < cols; c++) g += `<div class="hd">M${c}</div>`;
  rows.forEach(r => { g += `<div class="lab">${esc(r.cohort)}${r.size < 5 ? '<span class="tag warn" title="fewer than 5 accounts">n&lt;5</span>' : ''}</div><div class="cell" style="background:transparent;color:var(--ink-3)">${r.size}</div>`;
    for (let c = 0; c < cols; c++) { const v = r.cells[c]; if (v == null) { g += `<div class="cell" style="background:transparent"></div>`; continue; } const a = 0.08 + v * 0.72; g += `<div class="cell" style="background:rgba(21,143,163,${a.toFixed(2)});color:${v > 0.55 ? '#fff' : 'var(--ink)'}">${Math.round(v * 100)}%</div>`; } });
  g += '</div>'; el.innerHTML = g;
}

}

  T += PR('EBITDA', p => p.ebitda, money, 'tot'); T += PR('EBITDA before development', p => p.ebitda_x, money, 'sub');

  T += PR('Transfer pricing', p => -p.tp, money, 'sub'); T += PR('Net profit after transfer pricing', p => p.np_tp, money, 'tot'); T += PR('Product development capitalised (memo)', p => p.devC, money, 'sub');
  T += sec('Client movement', total);
  T += R('Legacy new', mv.leg_new, fmt.int, 'sub'); T += R('Legacy reactivated', mv.leg_react, fmt.int, 'sub'); T += R('Legacy churned', mv.leg_churn.map(v => -v), fmt.int, 'sub'); T += R('Legacy migrated to ROAS', mv.leg_migrated.map(v => -v), fmt.int, 'sub');
  T += R('ROAS signed', mv.roas_signed.slice(0, n), fmt.int, 'sub'); T += R('ROAS churned', mv.roas_churn.slice(0, n).map(v => -v), fmt.int, 'sub'); T += R('ROAS reactivated', mv.roas_react.slice(0, n), fmt.int, 'sub');
  T += sec('Creators', total);
  T += R('New (first active month)', cr.new, fmt.int, 'sub'); T += R('Reactivated', cr.react, fmt.int, 'sub'); T += R('Churned', cr.churned.map(v => -v), fmt.int, 'sub'); T += R('Major creators', cr.major, fmt.int, '', p => p.creators.major_end);
  T += R('Orders from active creators', cr.orders_active, fmt.int, 'sub'); T += R('Orders from Major creators', cr.orders_major, fmt.int, 'sub'); T += R('Creators recruited (first order)', cr.recruited, fmt.int, 'sub');
  T += sec('Acquisition', total);
  T += R('Merchant acquisition spend', S.cac_merchant_spend, money, 'sub'); T += R('Creator acquisition spend', S.cac_creator_spend, money, 'sub');
  T += R('Merchant CAC (month)', months.map((_, k) => { const s = S.cac_merchant_spend[k], b = mv.roas_signed[k]; return (s != null && b) ? s / b : null; }), money, '', p => p.cac ? p.cac.cac : null);
  T += sec('Metrics <span class="tag warn">basis under review</span>', total);
  T += R('GMV (legacy, net)', S.gmv, money); T += R('Take rate', months.map((_, k) => S.gmv[k] ? S.rev_legacy[k] / S.gmv[k] : null), pct1, '', p => p.gmv ? p.rev.legacy / p.gmv : null);
  T += R('AOV (GMV ÷ orders)', months.map((_, k) => S.gmv[k] && cr.orders_total[k] ? S.gmv[k] / cr.orders_total[k] : null), v => fmt.money(v, 0), '', p => p.gmv && p.creators.orders_total ? p.gmv / p.creators.orders_total : null);
  T += R('Orders per ad', months.map((_, k) => S.ads[k] && k >= 15 ? cr.orders_total[k] / S.ads[k] : null), v => fmt.num(v, 1), '', false);
  T += R('Contribution per order', months.map((_, k) => cr.orders_total[k] ? pls[k].cm / cr.orders_total[k] : null), v => fmt.money(v, 1), '', false);
  T += '</tbody></table>';
  root.innerHTML = h`<div class="pagehead"><div><p class="eyebrow">04 · Monthly actuals</p><h1 class="h2">Full grid, Jan-24 to ${fmt.month(Lm)}</h1><p>Actuals only. Projection columns from the old model are not carried over. Scroll sideways; the first column stays put. Year columns sum additive rows and show period-end values for snapshots.</p></div></div>
    <div class="card"><div class="tblwrap" id="act-wrap">${T}</div><div class="note"><b>P</b> provisional Ounass month${addbackActive() ? ' (AED 150k add-back applied)' : ''}. Development follows the capitalisation switches on the Control page. 2024–25 P&amp;L lines are the frozen snapshot from the old model pending the 2024–25 P&amp;L cross-check (F4).</div></div>`;
  const w = document.getElementById('act-wrap'); if (w) w.scrollLeft = w.scrollWidth;
}

/* ============================================================ PAGE 5: control */
function renderControl() {
  const root = document.getElementById('page-control'); const ctl = M.control, o = ctl.ounass; const Lm = M.latest_month;
  const prov = o.provisional_months;
  const oun = D.merchants.find(m => m.name === o.merchant);
  const rows = prov.map(m => { const k = kOf(m); const conf = state.confirmed.has(m); const sys = RAW.base.merchants.find(x => x.name === o.merchant).monthly[k];
    return `<tr><td>${fmt.month(m)}</td><td>${fmt.moneyFull(sys * M.fx).replace('$', 'AED ')}</td><td>${fmt.moneyFull(sys)}</td><td>${conf ? '<span class="muted">—</span>' : (addbackActive() ? '<span class="pos">+ AED ' + o.buffer_aed.toLocaleString() + ' added back</span>' : '<span class="muted">held (deducted)</span>')}</td>
      <td>${conf ? '<span class="tag ok">Confirmed · locked</span>' : '<span class="tag coral">Unconfirmed</span>'}</td><td><button class="btn ghost" data-conf="${m}" style="padding:4px 10px;font-size:12px">${conf ? 'Unconfirm' : 'Mark confirmed'}</button></td></tr>`; }).join('');
  const caps = Object.keys(state.cap).map(y => `<tr><td>${y}</td><td>${['Capitalised', 'Expensed', 'Split'].map(v => `<button class="btn ${state.cap[y] === v ? '' : 'ghost'}" data-cap="${y}" data-v="${v}" style="padding:4px 10px;font-size:12px;margin-right:6px">${v}</button>`).join('')}</td><td class="muted small">${y === '2024' ? 'Split = Jan–Jun capitalised, Jul–Dec expensed (spec default)' : y === '2025' ? 'Spec default: Capitalised ($100.5k)' : 'Spec default: Expensed; may be capitalised at year end'}</td></tr>`).join('');
  const checks = M.checks.map(c => `<tr><td>${c.id}</td><td style="text-align:left;white-space:normal">${esc(c.metric)} <span class="muted">· ${esc(c.period)}</span></td><td>${c.expected}</td><td>${c.got}</td><td>${c.pass ? '<span class="ok">pass</span>' : '<span class="neg">FAIL</span>'}</td></tr>`).join('');
  const rv = D.review;
  const newNames = rv.new_names.length ? rv.new_names.map(r => `<li><b>${esc(r.extract_name)}</b> · ${esc(r.action)} <span class="muted">(merchant match: ${r.merchant_match[0]} ${r.merchant_match[1] ? '→ ' + esc(r.merchant_match[1]) + ' ' + r.merchant_match[2] : ''}; ladder: ${r.ladder_match[0]})</span></li>`).join('') : '<li class="muted">none</li>';
  const idf = rv.creator_id_flags.length ? rv.creator_id_flags.map(f => `<li>${esc(f.join(' · '))}</li>`).join('') : '<li class="muted">none</li>';
  const r2 = rv.r2_churned.length ? rv.r2_churned.map(b => `<li><b>${esc(b)}</b> · churned by the 6-months-without-payment backstop; update the ladder Churn month</li>`).join('') : '<li class="muted">none</li>';
  const seg = D.roas_brands.filter(b => !b.other_pricing && ['New', 'Existing', 'Reactivated'].includes(b.status)).map(b => `<tr><td>${esc(b.name)}${b.migrated ? '<span class="tag">migrated</span>' : ''}</td><td>${fmt.month(b.since)}</td><td>${b.level}</td><td>${fmt.moneyFull(b.paid_to_latest)}</td><td><span class="sw ${b.tier === 'Small' ? 's' : b.tier === 'Medium' ? 'm' : 'l'}"></span>${b.tier || '—'}</td><td class="muted">${b.status}</td></tr>`).join('');
  const plugMax = Math.max(...S.rev_plug.map(Math.abs));
  root.innerHTML = h`<div class="pagehead"><div><p class="eyebrow">05 · Control &amp; data quality</p><h1 class="h2">Finance controls and the monthly load check</h1><p>Nothing here changes a number by hand. Confirmations and switches set status; every figure is recomputed from the extracts. Changes are kept in this browser until you export <code>control.json</code> and commit it with the next monthly build.</p></div>
      <button class="btn" id="export-ctl">Export control.json</button></div>
    <div class="grid g2">
      <div class="card"><p class="eyebrow">Ounass provisional months</p><h3 class="h3">Buffer AED ${o.buffer_aed.toLocaleString()} · currently <b>${state.buffer === 'on' ? 'held' : 'added back'}</b></h3>
        <div class="tblwrap"><table class="t dense fit"><thead><tr><th>Month</th><th>System figure</th><th>USD</th><th>Buffer</th><th>Status</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>
        <div class="note">The system figure for Ounass is an estimate until the confirmed extract arrives about two months after month end. A confirmed month is locked at its extract value and the buffer never touches it. Months older than two months still unconfirmed are flagged on load. The buffer toggle in the header switches the add-back on unconfirmed months; it moves revenue between the plug and Ounass, so total revenue does not change.</div></div>
      <div class="card"><p class="eyebrow">Development cost treatment</p><h3 class="h3">One switch per year</h3>
        <div class="tblwrap"><table class="t dense fit"><thead><tr><th>Year</th><th style="text-align:left">Treatment</th><th style="text-align:left">Note</th></tr></thead><tbody>${caps}</tbody></table></div>
        <div class="note"><b>Capitalised</b>: shown as a memo line below net profit and excluded from EBITDA (amortisation comes through D&amp;A). <b>Expensed</b>: inside Technology opex, reducing EBITDA. EBITDA before development is shown on every page regardless.</div></div>
    </div>
    <div class="grid g2" style="margin-top:16px">
      <div class="card"><p class="eyebrow">Review lists</p>
        <h3 class="h3">New or unknown merchant names</h3><ul class="plain">${newNames}</ul>
        <h3 class="h3" style="margin-top:12px">Creator ID flags</h3><ul class="plain">${idf}</ul>
        <h3 class="h3" style="margin-top:12px">ROAS brands churned by rule R2</h3><ul class="plain">${r2}</ul>
        <h3 class="h3" style="margin-top:12px">Legacy merchants with proposed / low-confidence segment</h3><ul class="plain">${rv.low_confidence.length ? rv.low_confidence.map(esc).join(', ') : '<li class="muted">none</li>'}</ul></div>
      <div class="card"><p class="eyebrow">Reconciliation</p><h3 class="h3">Unallocated plug by month (P&amp;L sales − named legacy − ROAS − other)</h3><div class="chart" id="ctl-plug"></div>
        <div class="note">Negative months are cash-vs-invoice timing on ROAS. Large positive months are provisional Datos figures below the P&amp;L (Ounass). Mapped cost of sales and EBITDA tie to the P&amp;L within AED 0.01.</div>
        <div class="hairline"></div><p class="eyebrow">Load log</p>
        <dl class="kv"><dt>Built</dt><dd>${M.built}</dd><dt>Latest full month</dt><dd>${fmt.monthLong(Lm)} (Datos + P&amp;L)</dd><dt>ROAS ladder</dt><dd>${M.ladder_file} (to Oct-26, Sep used as latest ROAS month)</dd><dt>Merchants / ROAS brands</dt><dd>${D.merchants.length} / ${D.roas_brands.length}</dd><dt>FX</dt><dd>AED ${M.fx} per USD</dd><dt>Cash report (S10)</dt><dd class="muted">not loaded</dd><dt>Plan / budget (S11)</dt><dd class="muted">not loaded</dd><dt>Net order history (T1)</dt><dd class="muted">pending · order metrics flagged</dd></dl></div>
    </div>
    <div class="grid g2" style="margin-top:16px">
      <div class="card"><p class="eyebrow">ROAS size tiers · ${fmt.month(S.months[L()])}</p><h3 class="h3">Active brands and their tier</h3>
        <div class="tblwrap"><table class="t dense fit"><thead><tr><th>Brand</th><th>Since</th><th>Level</th><th>Paid to date</th><th style="text-align:left">Tier</th><th>Status</th></tr></thead><tbody>${seg}</tbody></table></div>
        <div class="note">Small: CAC not yet paid back on profit (paid × 50% &lt; CAC). Medium: paid back. Large: annualised spend ≥ the legacy benchmark (${fmt.money(S.benchmark_large[L()])}, the ${S.benchmark_seg[L()]} segment ARPA). Recalculated every month, so brands can move down as well as up.</div></div>
      <div class="card"><p class="eyebrow">Build check</p><h3 class="h3">${M.checks_pass} of ${M.checks.length} check figures reproduced</h3>
        <div class="tblwrap" style="max-height:420px;overflow:auto"><table class="t dense fit"><thead><tr><th>ID</th><th style="text-align:left">Metric</th><th>Expected</th><th>Got</th><th></th></tr></thead><tbody>${checks}</tbody></table></div></div>
    </div>
    <div class="card" style="margin-top:16px"><p class="eyebrow">Definitions &amp; notes</p><div class="defs">
      <p><b>Active legacy client:</b> annualised revenue ≥ $950 and fewer than 6 consecutive months below $100. <b>Churned (legacy):</b> the first month either test fails (not backdated); i.e. no longer meets the threshold ($950/yr, or 6+ quiet months).</p>
      <p><b>ROAS brand:</b> active from its ladder Since month; churned at the ladder Churn month, or after 6 months without payment. No revenue threshold. The two segments use different churn triggers by design.</p>
      <p><b>Migrated clients</b> (DKNY, Izil, Metro Brazil) are one client in one view per month — legacy before their Since month, ROAS after — never counted twice.</p>
      <p><b>ARR:</b> legacy = last 3 months each ÷ its seasonality weight, averaged; ROAS = last 3 months × 4. <b>ARPA</b> = ARR ÷ average active accounts over the same 3 months.</p>
      <p><b>Churn rates</b> are stored monthly (unique churned ÷ average active ÷ months) and shown as 12-month churn, 1 − (1 − m)¹², with average lifetime 1 ÷ m.</p>
      <p><b>LTV</b> = ARPA ÷ 12 × margin × lifetime (capped 60 months). ROAS uses logo churn and a 50% margin; legacy uses revenue churn (1 − GRR) and the actual TTM contribution margin.</p>
      <p><b>Size — legacy:</b> Enterprise = annualised revenue ≥ AED 1M (exit below 500k); Growth / SME by the client's own company revenue (≥ / &lt; $50M). <b>Size — ROAS:</b> Small = CAC not yet paid back on profit; Medium = paid back; Large = annualised spend ≥ the ARPA of the largest legacy segment by account count.</p>
      <p><b>Creators:</b> active = averages ≥5 net orders/month and ordered in the last 6 months; Major = annualised ≥5,000 net orders (exit below 2,500). Order and GMV history before Jun-26 appears gross, so those metrics are flagged “basis under review”.</p>
      <p><b>Development accounting:</b> ${Object.entries(state.cap).map(([y, v]) => y + ' ' + v).join(', ')} (set above). EBITDA before development is shown throughout so the accounting change doesn’t read as cost growth.</p>
      <p><b>Ads &amp; CAC:</b> ad counting changed in Apr-25, so 2024 ads aren’t comparable; 2024 CAC may be understated (company spun out of ITCAN in 2024). All acquisition spend is on ROAS; legacy CAC is n/a.</p>
    </div></div>`;
  root.querySelectorAll('[data-conf]').forEach(b => b.addEventListener('click', () => { const m = b.dataset.conf; state.confirmed.has(m) ? state.confirmed.delete(m) : state.confirmed.add(m); LS('mm.confirmed', JSON.stringify([...state.confirmed])); mergeData(); renderAll(); }));
  root.querySelectorAll('[data-cap]').forEach(b => b.addEventListener('click', () => { state.cap[b.dataset.cap] = b.dataset.v; LS('mm.cap', JSON.stringify(state.cap)); renderAll(); }));
  document.getElementById('export-ctl').addEventListener('click', () => { const out = JSON.parse(JSON.stringify(ctl)); out.ounass.confirmed_months = [...state.confirmed].sort(); out.capitalisation = state.cap; const blob = new Blob([JSON.stringify(out, null, 2)], { type: 'application/json' }); const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'control.json'; a.click(); });
  barChart(document.getElementById('ctl-plug'), { labels: S.months.map(m => fmt.month(m)), fullLabels: S.months.map(fmt.monthLong), series: [{ name: 'Unallocated plug', color: 'var(--c-plug)', values: S.rev_plug }], height: 170 });
}

boot();
</script>
</body>
