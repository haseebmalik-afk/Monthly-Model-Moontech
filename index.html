<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MoonTech Monthly Model</title>
<meta name="description" content="MoonTech monthly model dashboard: revenue, ARR, retention and unit economics for Commission and ROAS clients, rebuilt each month from the raw extracts.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Inter+Tight:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F3F1EC; --paper-2:#EAE7E0; --paper-3:#E1DDD4; --card:#FFFFFF;
  --ink:#1F1D1A; --ink-2:#47443F; --ink-3:#847F77; --ink-4:#B0ABA2;
  --rule:rgba(31,29,26,.13); --rule-2:rgba(31,29,26,.06);
  --coral:#E8401C; --coral-wash:rgba(232,64,28,.09); --teal:#1296AE; --teal-wash:rgba(18,150,174,.10);
  --indigo:#6257C9; --green:#1F8A52; --ochre:#B07218; --violet:#6257C9; --grey:#938E86; --grey-2:#D6D1C8;
  --deep:#C4330F; --block:#E8401C; --block-text:#FFFFFF;
  --c-legacy:var(--teal); --c-roas:var(--coral); --c-other:var(--grey); --c-plug:var(--grey-2);
  --good:#1F8A52; --warn:#B07218; --bad:#C0392B;
  --radius:4px; --shadow:none;
}
:root:not([data-theme="light"]){ color-scheme: light; }
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#1C1A18; --paper-2:#232120; --paper-3:#2B2826; --card:#232120;
  --ink:#F4F1EC; --ink-2:#D4D0C9; --ink-3:#938E86; --ink-4:#65605A;
  --rule:rgba(244,241,236,.14); --rule-2:rgba(244,241,236,.07);
  --coral:#F2552E; --coral-wash:rgba(242,85,46,.16); --teal:#2BAEC4; --teal-wash:rgba(43,174,196,.16);
  --indigo:#8A80E8; --green:#3DB172; --ochre:#D08A2A; --violet:#8A80E8; --grey:#938E86; --grey-2:#4A463F;
  --deep:#F2552E; --block:#E8401C; --block-text:#FFFFFF;
  --good:#3DB172; --bad:#E06A5F; color-scheme:dark; }}
:root[data-theme="dark"]{
  --paper:#1C1A18; --paper-2:#232120; --paper-3:#2B2826; --card:#232120;
  --ink:#F4F1EC; --ink-2:#D4D0C9; --ink-3:#938E86; --ink-4:#65605A;
  --rule:rgba(244,241,236,.14); --rule-2:rgba(244,241,236,.07);
  --coral:#F2552E; --coral-wash:rgba(242,85,46,.16); --teal:#2BAEC4; --teal-wash:rgba(43,174,196,.16);
  --indigo:#8A80E8; --green:#3DB172; --ochre:#D08A2A; --violet:#8A80E8; --grey:#938E86; --grey-2:#4A463F;
  --deep:#F2552E; --block:#E8401C; --block-text:#FFFFFF;
  --good:#3DB172; --bad:#E06A5F; color-scheme:dark; }

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased;font-feature-settings:"tnum" 1,"cv11" 1}
a{color:inherit}
.wrap{max-width:1680px;margin:0 auto;padding:0 clamp(20px,2.4vw,56px)}
@media (min-width:1900px){.wrap{max-width:1840px}}
@media (max-width:640px){.wrap{padding:0 16px}}

/* ---- header */
header.top{border-bottom:1px solid var(--rule);background:var(--paper);position:sticky;top:0;z-index:20}
.topbar{display:flex;align-items:center;gap:18px;height:64px}
.brand{display:flex;align-items:center;gap:14px;min-width:0}
.brand img{height:30px;width:auto;display:block}
.brand .logo-ink{display:block}.brand .logo-paper{display:none}
:root[data-theme="dark"] .brand .logo-ink{display:none}:root[data-theme="dark"] .brand .logo-paper{display:block}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .brand .logo-ink{display:none}:root:not([data-theme="light"]) .brand .logo-paper{display:block}}
.brand .sep{width:1px;height:28px;background:var(--rule)}
.brand .title{font-family:"Inter Tight",Inter,sans-serif;font-weight:600;font-size:15px;letter-spacing:.01em;white-space:nowrap}
.brand .title small{display:block;font-family:Inter;font-weight:500;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}
.spacer{flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);border:1px solid var(--rule);padding:5px 9px;border-radius:999px;white-space:nowrap}
.pill b{color:var(--ink);font-weight:600;letter-spacing:.02em;text-transform:none;font-size:12px}
.pill .dot{width:7px;height:7px;border-radius:50%;background:var(--coral)}
.iconbtn{border:1px solid var(--rule);background:transparent;color:var(--ink);width:34px;height:34px;border-radius:999px;cursor:pointer;display:grid;place-items:center}
.iconbtn:hover{background:var(--paper-2)}

nav.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;border-top:1px solid var(--rule-2)}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{appearance:none;border:0;background:transparent;color:var(--ink-3);font:inherit;font-weight:500;font-size:13px;padding:12px 14px 11px;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;letter-spacing:.01em}
nav.tabs button:hover{color:var(--ink)}
nav.tabs button.active{color:var(--ink);border-bottom-color:var(--coral)}
nav.tabs button .n{font-size:10px;color:var(--ink-4);margin-right:6px;letter-spacing:.08em}

/* ---- controls */
.controls{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;padding:14px 0 6px}
.ctl{display:flex;align-items:center;gap:8px}
.ctl label{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);white-space:nowrap}
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:var(--radius);overflow:hidden}
.seg button{appearance:none;border:0;background:transparent;color:var(--ink-2);font:inherit;font-size:12.5px;font-weight:500;padding:6px 11px;cursor:pointer;border-right:1px solid var(--rule-2)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--ink);color:var(--paper)}
.seg button:hover:not(.on){background:var(--paper-2)}
select.sel{appearance:none;border:1px solid var(--rule);background:var(--paper) url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6'><path d='M0 0l5 6 5-6z' fill='%237A7E84'/></svg>") no-repeat right 10px center;color:var(--ink);font:inherit;font-size:12.5px;font-weight:500;padding:6px 28px 6px 10px;border-radius:var(--radius);cursor:pointer}
.flagbar{display:flex;flex-wrap:wrap;gap:8px;padding:6px 0 14px}
.flag{display:inline-flex;align-items:center;gap:6px;font-size:11px;color:var(--ink-2);border:1px solid var(--rule);border-radius:3px;padding:3px 8px;background:var(--card)}
.flag.coral{border-color:var(--coral);color:var(--coral)}
.flag.teal{border-color:var(--teal);color:var(--teal)}
.flag i{font-style:normal;font-weight:700}

/* ---- layout primitives */
section.page{display:none;padding-bottom:60px}
section.page.active{display:block}
section[data-view="co"] .seg-only{display:none!important}
section[data-view="co"] table.t tr.sub,section[data-view="co"] table.t tr.sub2{display:none}
.viewnote{font-size:12px;color:var(--text-3);margin:-4px 0 10px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g32{grid-template-columns:minmax(0,3fr) minmax(0,2fr)}.g23{grid-template-columns:minmax(0,2fr) minmax(0,3fr)}
@media (max-width:1240px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:1000px){.g3{grid-template-columns:repeat(2,minmax(0,1fr))}.g32,.g23{grid-template-columns:1fr}}
@media (max-width:1100px){.hero{font-size:38px}.card{padding:16px 18px}}
@media (max-width:640px){.g2,.g3,.g4{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--rule);border-radius:var(--radius);padding:18px 20px;min-width:0}
.card.block{background:var(--block);color:var(--block-text);border-color:var(--block);position:relative;overflow:hidden}.card.block::after{content:'';position:absolute;right:-28px;bottom:-30px;width:170px;height:170px;background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 200'><path fill='rgba(255,255,255,0.12)' d='M150 20c-8 22-30 28-44 44-12 14-14 34-6 50 2 4 0 8-4 8-18 2-36-6-46-22-12-20-8-48 10-64 16-14 56-22 90-16zM96 108c10-14 28-20 44-20 4 0 6 4 4 8-8 16-24 28-42 30-6 0-10-12-6-18z'/></svg>") no-repeat center/contain;pointer-events:none}.card.block>*{position:relative;z-index:1}
.card.block .eyebrow{color:rgba(255,255,255,.72)}
.card.block .muted{color:rgba(255,255,255,.72)}
.card.block .hairline{border-color:rgba(238,236,231,.14)}
.eyebrow{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2);font-weight:600;margin:0 0 6px}
.h2{font-family:"Inter Tight",Inter,sans-serif;font-size:20px;font-weight:600;letter-spacing:-.005em;margin:0 0 4px}
.h3{font-family:"Inter Tight",Inter,sans-serif;font-size:15px;font-weight:700;margin:0 0 2px}
.muted{color:var(--ink-3)}
.small{font-size:12px}
.hairline{border-top:1px solid var(--rule);margin:14px 0}
.pagehead{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin:8px 0 18px;flex-wrap:wrap}
.pagehead p{margin:4px 0 0;max-width:720px;color:var(--ink-2)}
.hero{font-family:"Inter Tight",Inter,sans-serif;font-size:44px;font-weight:600;letter-spacing:-.02em;line-height:1;margin:6px 0 4px;font-variant-numeric:tabular-nums}
.hero.sm{font-size:30px}
.delta{font-size:12px;font-weight:600}
.delta.up{color:var(--good)}
.card.block .delta.up,.card.block .delta.down,.card.block .delta.flat{color:rgba(255,255,255,.92)}.delta.down{color:var(--bad)}.delta.flat{color:var(--ink-3)}
.split{display:flex;gap:14px;margin-top:10px;flex-wrap:wrap}
.split .it{display:flex;align-items:baseline;gap:7px;font-size:12.5px}
.split .it .k{color:var(--ink-3)}
.split .it b{font-weight:600}
.card.block .split .it .k{color:rgba(255,255,255,.72)}
.card.block .sw.legacy,.card.block .sw.roas{outline:1px solid rgba(255,255,255,.5)}
.sw{display:inline-block;width:9px;height:9px;border-radius:2px;vertical-align:-1px;margin-right:6px}
.sw.legacy{background:var(--c-legacy)}.sw.roas{background:var(--c-roas)}.sw.other{background:var(--c-other)}.sw.plug{background:var(--c-plug)}
.sw.ent{background:var(--teal)}.sw.gro{background:var(--ochre)}.sw.sme{background:var(--violet)}
.sw.s{background:var(--ochre)}.sw.m{background:var(--coral)}.sw.l{background:var(--deep)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--ink-2);margin-top:8px}
.tag{display:inline-block;font-size:10px;letter-spacing:.08em;text-transform:uppercase;padding:2px 6px;border-radius:3px;border:1px solid var(--rule);color:var(--ink-3);margin-left:6px;vertical-align:middle;font-weight:600}
.tag.coral{color:var(--coral);border-color:var(--coral)}
.tag.warn{color:var(--ochre);border-color:var(--ochre)}
.tag.ok{color:var(--good);border-color:var(--good)}
.note{font-size:12px;color:var(--ink-3);margin-top:10px;line-height:1.5}
.note b{color:var(--ink-2)}

/* ---- tables */
.tblwrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.t{width:100%;border-collapse:separate;border-spacing:0;font-size:13px;font-variant-numeric:tabular-nums}
table.t th,table.t td{padding:7px 10px;text-align:right;border-bottom:1px solid var(--rule-2);white-space:nowrap;vertical-align:middle}
table.t th{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);font-weight:600;border-bottom:1px solid var(--rule)}
table.t th:first-child,table.t td:first-child{text-align:left;position:sticky;left:0;background:var(--card);z-index:1;white-space:normal;min-width:260px;max-width:360px}
table.t tr.sec td{padding-top:16px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--coral);font-weight:700;border-bottom:1px solid var(--rule)}
table.t tr.tot td{font-weight:600;border-top:1px solid var(--rule)}
table.t tr.sub td:first-child{padding-left:24px;color:var(--ink-2)}
table.t tr.sub2 td:first-child{padding-left:38px;color:var(--ink-3)}
table.t tr.sub td,table.t tr.sub2 td{color:var(--ink-2)}
table.t td.na{color:var(--ink-4)}
table.t td .f,table.t th .f{font-size:9px;color:var(--coral);margin-left:3px;vertical-align:super;font-weight:700}
table.t tbody tr:hover td{background:var(--paper-2)}
table.t th.now,table.t td.now{background:var(--teal-wash)}
table.t.dense th,table.t.dense td{padding:5px 8px;font-size:12px}
table.t.fit th:first-child,table.t.fit td:first-child{min-width:0}
.neg{color:var(--bad)}
.pos{color:var(--good)}
.defs{font-size:12px;color:var(--ink-2);line-height:1.55;columns:2;column-gap:28px}
@media (min-width:1500px){.defs{columns:3}}
@media (max-width:800px){.defs{columns:1}}
.defs p{margin:0 0 8px;break-inside:avoid}
.defs b{color:var(--ink)}

/* ---- charts */
.chart{position:relative;width:100%}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart text{font-family:Inter,system-ui,sans-serif;fill:var(--ink-3);font-size:10.5px}
.chart .grid line{stroke:var(--rule-2);stroke-width:1}
.chart .axis line{stroke:var(--rule);stroke-width:1}
.chart .hit{fill:transparent}
.chart .hit:hover{fill:var(--rule-2)}
.tip{position:fixed;pointer-events:none;background:var(--ink);color:var(--paper);font-size:12px;padding:8px 10px;border-radius:4px;z-index:50;display:none;max-width:260px;line-height:1.4;box-shadow:0 6px 24px rgba(0,0,0,.18)}
.tip .t{font-weight:600;margin-bottom:3px}
.tip .r{display:flex;justify-content:space-between;gap:14px}
.tip .r span:first-child{opacity:.75}
.cohort{display:grid;gap:2px;font-size:11px}
.cohort .cell{height:26px;display:grid;place-items:center;border-radius:2px;color:var(--ink);font-weight:500}
.cohort .lab{display:flex;align-items:center;justify-content:flex-start;padding-left:4px;color:var(--ink-2);white-space:nowrap}
.cohort .hd{display:grid;place-items:center;color:var(--ink-3);font-size:10px;letter-spacing:.06em}

/* ---- horizontal bars */
.hbars{display:grid;gap:6px;margin-top:10px}
.hb{display:grid;grid-template-columns:130px 1fr 52px;align-items:center;gap:10px;font-size:12px}
.hb .n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink-2)}
.hb .bar{height:12px;background:var(--paper-2);border-radius:2px;overflow:hidden}
.hb .bar i{display:block;height:100%;background:var(--c-legacy);border-radius:0 2px 2px 0}
.hb .v{text-align:right;font-variant-numeric:tabular-nums}
/* ---- control page */
.switch{display:inline-flex;align-items:center;gap:8px;cursor:pointer;user-select:none}
.switch .tr{width:34px;height:18px;border-radius:999px;background:var(--grey-2);position:relative;transition:.15s}
.switch .tr::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#fff;transition:.15s}
.switch.on .tr{background:var(--coral)}
.switch.on .tr::after{left:18px}
.btn{appearance:none;border:1px solid var(--ink);background:var(--ink);color:var(--paper);font:inherit;font-size:12.5px;font-weight:600;padding:8px 14px;border-radius:var(--radius);cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink)}
.btn:hover{opacity:.9}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 18px;font-size:12.5px}
.kv dt{color:var(--ink-3)}.kv dd{margin:0}
.statrow{display:flex;gap:28px;flex-wrap:wrap}
.statrow .st .v{font-family:"Inter Tight",Inter,sans-serif;font-size:22px;font-weight:600;letter-spacing:-.01em}
.statrow .st .k{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
ul.plain{margin:6px 0 0;padding-left:18px;font-size:12.5px;color:var(--ink-2)}
ul.plain li{margin:3px 0}
.loading{padding:80px 0;text-align:center;color:var(--ink-3)}
footer{border-top:1px solid var(--rule);padding:18px 0 40px;font-size:11.5px;color:var(--ink-3);display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px}
.ok{color:var(--good)}
/* ---------- ROAS Ladder (live report) ---------- */
#page-ladder .lad-scroll{max-height:calc(100vh - 230px);min-height:300px;overflow:auto;border:1px solid var(--rule);border-radius:10px}
#page-ladder table.lad{width:100%;border-collapse:separate;border-spacing:0;font-size:12.5px}
#page-ladder table.lad th{position:sticky;top:0;z-index:3;background:var(--card);padding:9px 8px;white-space:nowrap;text-align:right;font-weight:600;color:var(--ink-3);box-shadow:inset 0 -1px 0 var(--rule)}
#page-ladder table.lad th.txt,#page-ladder table.lad td.txt{text-align:left}
#page-ladder table.lad td{padding:0 8px;height:44px;border-bottom:1px solid var(--rule-2);vertical-align:middle;text-align:right;font-variant-numeric:tabular-nums}
#page-ladder table.lad th:first-child,#page-ladder table.lad td:first-child{position:sticky;left:0;z-index:2;background:var(--card);box-shadow:inset -1px 0 0 var(--rule)}
#page-ladder table.lad thead th:first-child{z-index:4}
#page-ladder table.lad tbody tr:hover td{background:var(--teal-wash)}
#page-ladder tr.dropped td:not(.keep)>*{opacity:.5}
#page-ladder .cwrap{display:flex;align-items:center;gap:10px}
#page-ladder .cname{font-weight:600;color:var(--ink);font-size:13px;line-height:1.2}
#page-ladder .cstart{font-size:10.5px;color:var(--ink-4)}
#page-ladder .avatar{width:26px;height:26px;border-radius:6px;flex:0 0 26px;display:inline-flex;align-items:center;justify-content:center;color:#fff;font-size:10.5px;font-weight:700}
#page-ladder .lvl{display:inline-block;min-width:34px;padding:2px 7px;border-radius:5px;font-size:11px;font-weight:700;color:#fff;text-align:center}
#page-ladder .lvl0{background:var(--grey)}#page-ladder .lvl1{background:#7FB5C0}#page-ladder .lvl2{background:#4CA3B4}#page-ladder .lvl3{background:var(--teal)}#page-ladder .lvl4{background:#0E7A8E}#page-ladder .lvl5{background:#0B5E6E}
#page-ladder .step{color:var(--ink-3);font-size:11.5px}#page-ladder .step.none{color:var(--ink-4)}
#page-ladder .schip{display:inline-block;padding:1px 6px;border-radius:4px;font-size:11px;font-weight:600}
#page-ladder .schip.t1{background:var(--teal-wash);color:var(--teal)}#page-ladder .schip.t2{background:var(--teal-wash);color:var(--teal)}#page-ladder .schip.t3{background:rgba(18,150,174,.18);color:var(--teal)}#page-ladder .schip.t4{background:var(--coral-wash);color:var(--coral)}#page-ladder .schip.t5{background:var(--coral-wash);color:var(--deep)}
#page-ladder .arpa-big{font-weight:700;color:var(--teal)}
#page-ladder .st{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:11.5px;font-weight:600;white-space:nowrap}
#page-ladder .st .dot{width:6px;height:6px;border-radius:50%;background:currentColor}
#page-ladder .st-active{background:rgba(31,138,82,.12);color:var(--good)}
#page-ladder .st-scaling{background:var(--teal-wash);color:var(--teal)}
#page-ladder .st-watch{background:rgba(176,114,24,.14);color:var(--ochre)}
#page-ladder .st-low{background:var(--rule-2);color:var(--ink-3)}
#page-ladder .st-early{background:var(--rule-2);color:var(--ink-3)}
#page-ladder .st-risk{background:var(--coral-wash);color:var(--coral)}
#page-ladder .st-inactive{background:rgba(192,57,43,.1);color:var(--bad)}
#page-ladder .st-churned{background:rgba(192,57,43,.14);color:var(--bad)}
#page-ladder .warn{display:none;margin:12px 0;padding:10px 12px;border-radius:8px;background:var(--coral-wash);color:var(--deep);font-size:12.5px;border:1px solid var(--rule)}
#page-ladder .seg button.on{background:var(--ink);color:var(--card)}

let MT_COMM_TTM = {"amazon":{"c":155,"n":1},"americaneagle":{"c":2,"n":1,"g":38},"bathbodyworks":{"c":1269,"n":8},"bloomingdales":{"c":145974,"n":7,"g":1701443},"gap":{"c":16,"n":2,"g":1206},"hm":{"c":8961,"n":8,"g":395456},"izil":{"c":11247,"n":8,"g":66166},"levelshoes":{"c":223164,"n":8,"g":743353},"mamaspapas":{"c":1341,"n":7,"g":26109},"mumzworld":{"c":29233,"n":8,"g":391066},"namshi":{"c":1169,"n":8,"g":41385},"nayomi":{"c":23621,"n":8,"g":137912},"newbalance":{"c":71,"n":8,"g":2362},"niceone":{"c":91,"n":3,"g":5311},"noon":{"c":4330,"n":8},"ontime":{"c":1031,"n":8,"g":8221},"ounass":{"c":1647982,"n":8,"g":21517395},"riva":{"c":62052,"n":8,"g":742605},"sephora":{"c":546396,"n":8,"g":7299671},"styli":{"c":643,"n":8,"g":6157},"sunsports":{"c":62,"n":5},"swarovski":{"c":253,"n":3,"g":2898},"vogacloset":{"c":43880,"n":8,"g":360762},"6thstreet":{"c":965,"n":3,"g":16000},"adidasrakuten":{"c":3,"n":1},"dkny":{"c":13945,"n":8,"g":26077},"eyewa":{"c":2085,"n":5,"g":9202},"farfetch":{"c":406,"n":3},"mothercare":{"c":158,"n":8,"g":8486},"trendyol":{"c":7593,"n":8},"victoriassecret":{"c":97,"n":8,"g":2265},"airalo":{"c":456,"n":5,"g":8151},"facesarabylinks":{"c":21209,"n":7,"g":305479},"colehaan":{"c":66,"n":4},"metrobrazil":{"c":11,"n":2},"charlottetilbury":{"c":95371,"n":8},"bananarepublic":{"c":0,"n":1},"toucheprive":{"c":142,"n":1,"g":284},"squatwolf":{"c":19,"n":3,"g":162},"cos":{"c":52,"n":6,"g":3340},"goldenscentmt":{"c":17478,"n":8,"g":62549},"ultabeauty":{"c":11678,"n":8,"g":117341},"allbirds":{"c":366,"n":3,"g":355},"anafasicmt":{"c":2242,"n":3},"kitopirightbitemt":{"c":4446,"n":3,"g":31084},"aizamt":{"c":1935,"n":2},"maisonsafqamt":{"c":2906,"n":1,"g":17387},"studioearthmt":{"c":917,"n":1,"g":1139},"justhypemt":{"c":875,"n":1,"g":2407}};

let MT_LIVE_CAC = null;   // {cac, cost, n, year} — live blended merchant CAC from the CAC sheet; LTV:CAC uses it when present (live sources used live)
function mtCacUse(bakedCac) { return (MT_LIVE_CAC && MT_LIVE_CAC.cac) ? MT_LIVE_CAC.cac : bakedCac; }

function mtPayback(o) { if (!o) return null; const c = MT_LIVE_CAC && MT_LIVE_CAC.cac; const mm = (o.arpa != null && o.margin != null) ? o.arpa / 12 * o.margin : null; return (c && mm) ? c / mm : o.payback; }
const mtCacTag = () => (MT_LIVE_CAC && MT_LIVE_CAC.cac) ? ' <span class="tag">live CAC</span>' : '';
/* Adjustment indicator (USD, per 2026 month) from the monthly data pack: indicator = PnL Sales − ROAS ladder billing − ROAS spotted in merchant tracking = commission/legacy revenue in the P&L. Interim bake — to move into the pipeline. */
let MT_ADJ = {"m":["01","02","03","04","05","06","07","08"],"pnl":[323789,362858,579913,330345,426051,314421,345088,401593],"billing":[4000,7020,7150,1144,8000,7000,20169,18500],"spotted":[539,877,5498,1699,5583,2961,2605,4472],"adj":[-2511,3061,3276,-3906,5276,1154,21756,117588],"ind":[319250,354960,567265,327502,412468,304460,322314,378621]};

function mtRoasFactor(name, L) { if (!MT_ROAS_MAP) return null; const k = mtKey(name); let e = MT_ROAS_MAP[k]; if (!e) { for (const mk in MT_ROAS_MAP) { if (k && mk && (k.indexOf(mk) >= 0 || mk.indexOf(k) >= 0) && Math.min(k.length, mk.length) >= 5) { e = MT_ROAS_MAP[mk]; break; } } } return (e && e.levels[L]) ? e.levels[L].roas : (L ? L : null); }   // no mapping for the client -> standard ladder factor: L×
function mtRoasFactorIsStd(name, L) { if (!MT_ROAS_MAP) return false; const k = mtKey(name); let e = MT_ROAS_MAP[k]; if (!e) { for (const mk in MT_ROAS_MAP) { if (k && mk && (k.indexOf(mk) >= 0 || mk.indexOf(k) >= 0) && Math.min(k.length, mk.length) >= 5) { e = MT_ROAS_MAP[mk]; break; } } } return !(e && e.levels[L]); }

const SEG_C = { Enterprise: 'var(--teal)', Growth: 'var(--ochre)', SME: 'var(--violet)', Unassigned: 'var(--grey)' };
const TIER_C = { Small: 'var(--ochre)', Medium: 'var(--coral)', Large: 'var(--deep)' };
const LEG_SEGS = ['Enterprise', 'Growth', 'SME'], TIERS = ['Small', 'Medium', 'Large'];

async function boot() {
  try {
    const inline = document.getElementById('inline-data');
    if (inline) RAW = JSON.parse(inline.textContent);
    else { const r = await fetch('data.json', { cache: 'no-store' }); RAW = await r.json(); }
  } catch (e) { document.getElementById('loading').textContent = 'Could not load data.json. Serve this folder over http (GitHub Pages) rather than opening the file directly.'; return; }
  M = RAW.meta; MT_CUT = M.latest_month;
  // pipeline-built segmentation / control inputs (data pack); the inline constants above are the fallback
  if (RAW.base && RAW.base.series) { if (RAW.base.series.comm_ttm) MT_COMM_TTM = RAW.base.series.comm_ttm; if (RAW.base.series.adj_indicator) MT_ADJ = RAW.base.series.adj_indicator; }
  const ctl = M.control;
  state.confirmed = new Set(JSON.parse(LS('mm.confirmed') || 'null') || ctl.ounass.confirmed_months);
  state.cap = Object.assign({}, ctl.capitalisation, JSON.parse(LS('mm.cap') || '{}'));
  state.cash = Object.assign({}, ctl.cash || {}, JSON.parse(LS('mm.cash') || '{}'));
  state.year = LS('mm.year') || M.latest_month.slice(0, 4);
  state.period = LS('mm.period') || ('TTM:' + M.latest_month);
  mergeData(); buildControls(); bindUI(); renderAll();
  document.getElementById('loading').style.display = 'none';
}
function scenarioKey() {
  if (state.buffer !== 'off') return 'none';

}

/* ============================================================ PAGE 1: investor */
function computeInvestor() {
  const Lm = M.latest_month, Lk = L();
  const ttm = P['TTM:' + Lm], ytd = P['YTD:' + Lm.slice(0, 4)], latest = P['M:' + Lm], sl = P['SL'];
  const ttmPrev = P['TTM:' + S.months[Lk - 12]], ytdPrev = P['YTD:' + S.months[Lk - 12].slice(0, 4)];
  const money = v => fmt.money(v), pct0 = v => fmt.pct(v, 0), pct1 = v => fmt.pct(v, 1);
  const ACTIVE = ['New', 'Existing', 'Reactivated'];
  const NM_MARGIN = 0.5, BLENDED_CHURN = 0.2;                 // assumptions from the Investor Metrics file
  const sum = a => a.reduce((x, y) => x + (y || 0), 0);
  const win = (k0, k1) => { const r = []; for (let k = k0; k <= k1; k++) r.push(k); return r; };
  const cur3 = win(Lk - 2, Lk), prev3 = win(Lk - 5, Lk - 3);  // "quarter" = last 3 months vs the 3 before (Jun–Aug vs Mar–May)
  const ytdK = win(Lk - (Lk % 12), Lk), ytdPrevK = ytdK.map(k => k - 12);
  const g = (a, b) => (a != null && b) ? a / b - 1 : null;      // growth
  const pts = (a, b) => (a != null && b != null) ? (a - b) : null;   // percentage-point change

  // ---- New Model (ROAS brands incl. Jetour) from the ladder
  const nm = D.roas_brands;
  const nmRev = ks => sum(nm.map(br => sum(ks.map(k => br.monthly[k] || 0))));
  const sinceK = br => S.months.indexOf(br.since);
  const churnK = br => br.churn_month ? S.months.indexOf(br.churn_month) : -1;
  const paidBy = k => nm.filter(br => sinceK(br) >= 0 && sinceK(br) <= k);
  const churnedBy = k => nm.filter(br => churnK(br) >= 0 && churnK(br) <= k && sinceK(br) <= k);
  const activeAt = k => paidBy(k).length - churnedBy(k).length;
  const nmArrCur = nmRev(cur3) * 4, nmArrPrev = nmRev(prev3) * 4;
  const nmActive = activeAt(Lk), nmActivePrev = activeAt(Lk - 3);
  const nmSigned = paidBy(Lk).filter(br => sinceK(br) >= 24).length;             // signed Jan–Aug 2026
  const nmSignedCur = nm.filter(br => cur3.includes(sinceK(br))).length, nmSignedPrev = nm.filter(br => prev3.includes(sinceK(br))).length;
  const monthsYtd = ytdK.length;
  const nmChurned = churnedBy(Lk).length, nmPaid = paidBy(Lk).length;
  const nmLogoChurn = nmPaid ? (nmChurned / nmPaid) * (12 / monthsYtd) : null;   // annualised, as in the file
  const nmLogoChurnPrev = (() => { const k = Lk - 3; const p = paidBy(k).length; return p ? (churnedBy(k).length / p) * (12 / (monthsYtd - 3)) : null; })();
  // NRR / GRR: last 3 months revenue from brands that paid in the 3 before, over what they paid then
  const nmRet = (k0s, k1s) => { let base = 0, now = 0, kept = 0; nm.forEach(br => { const a = sum(k0s.map(k => br.monthly[k] || 0)); if (a <= 0) return; const b2 = sum(k1s.map(k => br.monthly[k] || 0)); base += a; now += b2; kept += Math.min(a, b2); }); return base ? { nrr: now / base, grr: kept / base, cohort: nm.filter(br => sum(k0s.map(k => br.monthly[k] || 0)) > 0).length } : null; };
  const nmNrr = nmRet(prev3, cur3), nmNrrPrev = nmRet(win(Lk - 8, Lk - 6), prev3);
  // Upgrade rate: brands active during the window that moved up ≥1 level in it ÷ brands active during the window
  const upgrade = (k0, k1) => { let act = 0, up = 0; nm.forEach(br => { const sk = sinceK(br), ck = churnK(br); if (sk < 0 || sk > k1 || (ck >= 0 && ck < k0) || !br.level_monthly) return; act++; const l0 = br.level_monthly[k0 - 1] || 0, l1 = br.level_monthly[k1] || 0; if (l1 > l0 && sk < k0) up++; }); return act ? up / act : null; };
  const nmUp = upgrade(cur3[0], Lk), nmUpPrev = upgrade(prev3[0], prev3[2]);
  // CAC: spend since launch ÷ brands that have paid; quarter CAC = window spend ÷ brands signed in window
  const spendK = ks => sum(ks.map(k => S.cac_merchant_spend[k] || 0));
  const cacSL = sl.cac && sl.cac.cac != null ? mtCacUse(sl.cac.cac) : null;
  const cacCur = nmSignedCur ? spendK(cur3) / nmSignedCur : null, cacPrev = nmSignedPrev ? spendK(prev3) / nmSignedPrev : null;
  const nmArpa = nmActive ? nmArrCur / nmActive : null, nmArpaPrev = nmActivePrev ? nmArrPrev / nmActivePrev : null;
  const nmLtv = (nmArpa != null && nmLogoChurn) ? nmArpa * NM_MARGIN / nmLogoChurn : null;
  const nmLtvPrev = (nmArpaPrev != null && nmLogoChurnPrev) ? nmArpaPrev * NM_MARGIN / nmLogoChurnPrev : null;
  const nmLtvCac = (nmLtv != null && cacSL) ? nmLtv / cacSL : null;
  const nmPayback = (nmArpa && cacSL) ? cacSL / (nmArpa * NM_MARGIN / 12) : null;
  const nmPaybackPrev = (nmArpaPrev && cacPrev) ? cacPrev / (nmArpaPrev * NM_MARGIN / 12) : null;

  // ---- Blended (whole company)
  const blArr = latest.arr.blended, blArrPrev = S.arr_blended ? S.arr_blended[Lk - 12] : null;
  const blActive = latest.active_end.total, blActivePrev = P['M:' + S.months[Lk - 12]].active_end.total;
  const blArpa = blActive ? ttm.rev.total / blActive : null, blArpaPrev = (ttmPrev && blActivePrev) ? ttmPrev.rev.total / blActivePrev : null;
  const margin = ttm.legacy_margin_ttm, marginPrev = ttmPrev && ttmPrev.legacy_margin_ttm;
  const blLtv = (blArpa != null && margin != null) ? blArpa * margin / BLENDED_CHURN : null;
  const blLtvPrev = (blArpaPrev != null && marginPrev != null) ? blArpaPrev * marginPrev / BLENDED_CHURN : null;
  const blLtvCac = (blLtv != null && cacSL) ? blLtv / cacSL : null;
  const legNewPrev = ytdPrev ? ytdPrev.events.leg_new : null;                   // commission clients acquired Jan–Aug 2025
  // repeat revenue: % of YTD revenue (named clients) from clients that also paid in the prior year
  const repeat = (ks, prevKs) => { let tot = 0, rep = 0; const add = (mon, usd) => { const a = sum(ks.map(k => usd ? mon[k] : mon[k])); if (!a) return; tot += a; if (sum(prevKs.map(k => mon[k] || 0)) > 0) rep += a; };
    D.merchants.forEach(m => add(m.monthly)); nm.forEach(br => add(br.monthly)); return tot ? rep / tot : null; };
  const repNow = repeat(ytdK, win(ytdK[0] - 12, ytdK[0] - 1)), repPrev = repeat(ytdPrevK, win(ytdPrevK[0] - 12, ytdPrevK[0] - 1));

  return { ttm, ytd, latest, sl, ttmPrev, ytdPrev, money, pct0, pct1, ACTIVE, NM_MARGIN, BLENDED_CHURN, sum, win, cur3, prev3, ytdK, ytdPrevK, g, pts, nm, nmRev, sinceK, churnK, paidBy, churnedBy, activeAt, nmArrCur, nmArrPrev, nmActive, nmActivePrev, nmSigned, nmSignedCur, nmSignedPrev, monthsYtd, nmChurned, nmPaid, nmLogoChurn, nmLogoChurnPrev, nmRet, nmNrr, nmNrrPrev, upgrade, nmUp, nmUpPrev, spendK, cacSL, cacCur, cacPrev, nmArpa, nmArpaPrev, nmLtv, nmLtvPrev, nmLtvCac, nmPayback, nmPaybackPrev, blArr, blArrPrev, blActive, blActivePrev, blArpa, blArpaPrev, margin, marginPrev, blLtv, blLtvPrev, blLtvCac, legNewPrev, repeat, repNow, repPrev, nrr, nrrPrev, top1, top1Prev, cash, cashNum, cashBal, cashFund, burn, proForma, runway };
}

      <div class="card"><p class="eyebrow">Reconciliation</p><h3 class="h3">Adjustment by month (P&amp;L Sales − commission tracked − ROAS billing)</h3><div class="chart" id="ctl-plug"></div>
        <div class="note">Negative months: merchant tracking shows more than the P&amp;L (invoicing timing). Positive months: P&amp;L revenue not yet visible by client. Mapped cost of sales and EBITDA tie to the P&amp;L within AED 0.01.</div>
        <div class="hairline"></div><p class="eyebrow">Load log</p>
        <dl class="kv"><dt>Built</dt><dd>${M.built}</dd><dt>Latest full month</dt><dd>${fmt.monthLong(Lm)} (Datos + P&amp;L)</dd><dt>ROAS ladder</dt><dd>${M.ladder_file} (to Oct-26, Sep used as latest ROAS month)</dd><dt>Merchants / ROAS brands</dt><dd>${D.merchants.length} / ${D.roas_brands.length}</dd><dt>FX</dt><dd>AED ${M.fx} per USD</dd><dt>Cash report (S10)</dt><dd class="muted">not loaded</dd><dt>Plan / budget (S11)</dt><dd class="muted">not loaded</dd><dt>Net order history (T1)</dt><dd class="muted">pending · order metrics flagged</dd></dl></div>
    </div>
    <div class="grid g2" style="margin-top:16px">
      <div class="card"><p class="eyebrow">ROAS size tiers · ${fmt.month(S.months[L()])}</p><h3 class="h3">Active brands and their tier</h3>
        <div class="tblwrap"><table class="t dense fit"><thead><tr><th>Brand</th><th>Since</th><th>Level</th><th>Paid to date</th><th style="text-align:left">Tier</th><th>Status</th></tr></thead><tbody>${seg}</tbody></table></div>
        <div class="note">Small: CAC not yet paid back on profit (paid × 50% &lt; CAC). Medium: paid back. Large: annualised spend ≥ the commission benchmark (${fmt.money(S.benchmark_large[L()])}, the ${S.benchmark_seg[L()]} segment ARPA). Recalculated every month, so brands can move down as well as up.</div></div>
      <div class="card"><p class="eyebrow">Build check</p><h3 class="h3">${M.checks_pass} of ${M.checks.length} check figures reproduced</h3>
        <div class="tblwrap" style="max-height:420px;overflow:auto"><table class="t dense fit"><thead><tr><th>ID</th><th style="text-align:left">Metric</th><th>Expected</th><th>Got</th><th></th></tr></thead><tbody>${checks}</tbody></table></div></div>
    </div>
    <div class="card" style="margin-top:16px"><p class="eyebrow">Definitions &amp; notes</p><div class="defs">
      <p><b>Active commission client:</b> annualised revenue ≥ $950 and fewer than 6 consecutive months below $100. <b>Churned (commission):</b> the first month either test fails (not backdated); i.e. no longer meets the threshold ($950/yr, or 6+ quiet months).</p>
      <p><b>ROAS brand:</b> active from its ladder Since month; churned at the ladder Churn month, or after 6 months without payment. No revenue threshold. The two segments use different churn triggers by design.</p>
      <p><b>Migrated clients</b> (DKNY, Izil, Metro Brazil) are one client in one view per month — commission before their Since month, ROAS after — never counted twice.</p>
      <p><b>ARR:</b> commission = last 3 months each ÷ its seasonality weight, averaged; ROAS = last 3 months × 4. <b>ARPA</b> = ARR ÷ average active accounts over the same 3 months.</p>
      <p><b>Churn rates</b> are stored monthly (unique churned ÷ average active ÷ months) and shown as 12-month churn, 1 − (1 − m)¹², with average lifetime 1 ÷ m.</p>
      <p><b>LTV</b> = ARPA ÷ 12 × margin × lifetime (capped 60 months). ROAS uses logo churn and a 50% margin; commission uses revenue churn (1 − GRR) and the actual TTM contribution margin.</p>
      <p><b>Size — commission:</b> Enterprise = annualised revenue ≥ AED 1M (exit below 500k); Growth / SME by the client's own company revenue (≥ / &lt; $50M). <b>Size — ROAS:</b> Small = CAC not yet paid back on profit; Medium = paid back; Large = annualised spend ≥ the ARPA of the largest commission segment by account count.</p>
      <p><b>Creators:</b> active = averages ≥5 net orders/month and ordered in the last 6 months; Major = annualised ≥5,000 net orders (exit below 2,500). Order and GMV history before Jun-26 appears gross, so those metrics are flagged “basis under review”.</p>
      <p><b>Development accounting:</b> ${Object.entries(state.cap).map(([y, v]) => y + ' ' + v).join(', ')} (set above). EBITDA before development is shown throughout so the accounting change doesn’t read as cost growth.</p>
      <p><b>Ads &amp; CAC:</b> ad counting changed in Apr-25, so 2024 ads aren’t comparable; 2024 CAC may be understated (company spun out of ITCAN in 2024). All acquisition spend is on ROAS; commission CAC is n/a.</p>
    </div></div>`;
  root.querySelectorAll('[data-conf]').forEach(b => b.addEventListener('click', () => { const m = b.dataset.conf; state.confirmed.has(m) ? state.confirmed.delete(m) : state.confirmed.add(m); LS('mm.confirmed', JSON.stringify([...state.confirmed])); mergeData(); renderAll(); }));

  document.getElementById('export-ctl').addEventListener('click', () => { const out = JSON.parse(JSON.stringify(ctl)); out.ounass.confirmed_months = [...state.confirmed].sort(); out.capitalisation = state.cap; out.cash = state.cash || {}; const blob = new Blob([JSON.stringify(out, null, 2)], { type: 'application/json' }); const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'control.json'; a.click(); });
  barChart(document.getElementById('ctl-plug'), { labels: S.months.map(m => fmt.month(m)), fullLabels: S.months.map(fmt.monthLong), series: [{ name: 'Adjustment', color: 'var(--c-plug)', values: S.rev_plug }], height: 170 });
}

    </div>
    <div class="grid g4" style="margin-top:14px">

      ${card('ROAS share of revenue', fmt.pct(sel.rev.total ? sel.rev.roas / sel.rev.total : null, 0), '')}

`;

/* ============================================================ PAGE: Client Segmentation (two-axis) */
function renderSegmentation() {
  const root = document.getElementById('page-segmentation'); if (!root) return;
  const Lm = M.latest_month, Lk = L();
  const sel = P[state.period] || P['TTM:' + Lm];
  const model = state.segModel || 'all';
  const money = v => fmt.money(v);
  const arpaOf = s => (S.arpa && S.arpa[s]) ? S.arpa[s][Lk] : null;
  const naCell = '<td class="na" title="not segmentable">n/a</td>';
  const dash = '<td class="na">—</td>';
  const chTd = c => `<td>${churnTxt(c)}</td>`;
  const head = (lead, churnLab = 'Logo churn 12m') => `<thead><tr><th style="text-align:left">${lead}</th><th>Revenue</th><th>Active</th><th>ARPA</th><th>LTV</th><th>${churnLab}</th><th>CAC</th><th>Payback</th><th>LTV:CAC</th></tr></thead>`;

  // Commission block — rows E / G / SME (segmentable: revenue, active, ARPA, LTV, churn)
  const commRows = LEG_SEGS.map(s => {
    const lv = s === 'Enterprise' ? (sel.ltv && sel.ltv.Enterprise) : (sel.ltv && sel.ltv.GrowthSME);
    const ch = s === 'Enterprise' ? (sel.churn && sel.churn.Enterprise) : (sel.churn && sel.churn.GrowthSME);
    return `<tr><td><span class="sw" style="background:${SEG_C[s]}"></span>${s}</td>`
      + td(sel.rev.leg_seg[s], money) + td(sel.active_end.leg_seg[s], fmt.int) + td(arpaOf(s), money)
      + td(lv && lv.ltv, money) + chTd(ch) + naCell + naCell + naCell + '</tr>';
  }).join('');
  const commTot = `<tr class="tot"><td>All commission</td>`
    + td(sel.rev.legacy, money) + td(sel.active_end.legacy, fmt.int) + td(computeInvestor().blArpa, money)
    + dash + chTd(sel.churn && sel.churn.legacy) + naCell + naCell + naCell + '</tr>';
  const commTable = `<div class="card"><p class="eyebrow">Commission · by size (Enterprise / Growth / SME)</p>
    <div class="tblwrap"><table class="t">${head('Segment')}<tbody>${commRows}${commTot}</tbody></table></div>
    <div class="note">LTV and logo churn for Growth &amp; SME are measured together. CAC, payback and LTV:CAC don't break down by segment — there is no segment-level acquisition cost — so they show n/a.</div></div>`;

  const I = computeInvestor();   // ROAS unit economics: same definitions as the Investor Dashboard (as at the update date)
  const nmChurnOf = pred => { const paid = D.roas_brands.filter(b => pred(b) && I.sinceK(b) >= 0 && I.sinceK(b) <= Lk); const ch = paid.filter(b => I.churnK(b) >= 0 && I.churnK(b) <= Lk); return paid.length ? { r: ch.length / paid.length * (12 / I.monthsYtd), n: ch.length, p: paid.length } : null; };
  // churned brands carry no tier in the pipeline: apply the same CAC-payback rule to what they paid (50% margin)
  const tierOf = b => (b.tier && ['Small', 'Medium', 'Large'].includes(b.tier)) ? b.tier : (I.cacSL ? ((b.paid_to_latest || 0) * 0.5 / I.cacSL < 1 ? 'Small' : (b.paid_to_latest || 0) * 0.5 / I.cacSL < 2 ? 'Medium' : 'Large') : null);
  const nmChurnTd = c => c ? `<td>${fmt.pct(c.r, 0)} <span class="muted small">${c.n}/${c.p}${c.p < 5 ? '<span class="f" title="fewer than 5 brands">n&lt;5</span>' : ''}</span></td>` : '<td class="na">—</td>';
  // ROAS block — rows S / M / L (CAC/payback/LTV:CAC available at the ROAS total only)
  const roasRows = TIERS.map(s => `<tr><td><span class="sw" style="background:${TIER_C[s]}"></span>${s}</td>`
    + td(sel.rev.roas_tier[s], money) + td(sel.active_end.roas_tier[s], fmt.int) + dash + dash
    + nmChurnTd(nmChurnOf(b => tierOf(b) === s)) + naCell + naCell + naCell + '</tr>').join('');
  const roasTot = `<tr class="tot"><td>All ROAS</td>`
    + td(sel.rev.roas, money) + td(sel.active_end.roas, fmt.int) + td(I.nmArpa, money)
    + td(I.nmLtv, money) + nmChurnTd(nmChurnOf(() => true))
    + td(I.cacSL, money) + td(I.nmPayback, fmt.mo) + td(I.nmLtvCac, fmt.x) + '</tr>';
  const roasTable = `<div class="card" style="margin-top:16px"><p class="eyebrow">ROAS · by tier (Small / Medium / Large)</p>
    <div class="tblwrap"><table class="t">${head('Tier', 'Logo churn (annualised)')}<tbody>${roasRows}${roasTot}</tbody></table></div>
    <div class="note">Tiers follow the agreed CAC-payback rule: margin on what the brand has paid ÷ CAC — below 1× Small, 1–2× Medium, above 2× Large. ARPA, LTV, CAC, payback and LTV:CAC are only available for ROAS as a whole (total row, Investor definitions); per tier they show —.</div></div>`;

  // Unified size axis — ROAS brands carry E/G/SME too (pipeline/roas_segments.csv: Kareem's segmentation file + defaults)
  const kStart = S.months.indexOf(sel.start), kEnd = S.months.indexOf(sel.end);
  const ACTIVE = ['New', 'Existing', 'Reactivated'];
  const roasBySeg = {}; LEG_SEGS.forEach(sg => roasBySeg[sg] = { rev: 0, active: 0, n: 0, low: 0 });
  D.roas_brands.forEach(b => { if (b.other_pricing) return; const sg = roasBySeg[b.segment] ? b.segment : 'SME'; const o = roasBySeg[sg];
    for (let k = kStart; k <= kEnd; k++) o.rev += (b.monthly[k] || 0);
    if (ACTIVE.includes(b.status_monthly[kEnd])) { o.active++; if (b.segment_confidence === 'U.D') o.low++; } o.n++; });
  const roasSegRows = LEG_SEGS.map(sg => `<tr><td><span class="sw" style="background:${SEG_C[sg]}"></span>${sg}${roasBySeg[sg].low ? ' <span class="muted small">(' + roasBySeg[sg].low + ' U.D)</span>' : ''}</td>`
    + td(roasBySeg[sg].rev, money) + td(roasBySeg[sg].active, fmt.int) + dash + dash + nmChurnTd(nmChurnOf(b => (b.segment || 'SME') === sg)) + naCell + naCell + naCell + '</tr>').join('');
  const roasSegTable = `<div class="card" style="margin-top:16px"><p class="eyebrow">ROAS · by size (Enterprise / Growth / SME)</p>
    <div class="tblwrap"><table class="t">${head('Segment', 'Logo churn (annualised)')}<tbody>${roasSegRows}${roasTot}</tbody></table></div>
    <div class="note">Same size definitions as commission. Segments for ROAS brands come from Kareem's customer segmentation file (v2, 5 Nov); a brand not in it would show as SME · U.D (undefined) with a count per row.</div></div>`;
  const bothRows = LEG_SEGS.map(sg => `<tr><td><span class="sw" style="background:${SEG_C[sg]}"></span>${sg}</td>`
    + td((sel.rev.leg_seg[sg] || 0) + roasBySeg[sg].rev, money) + td((sel.active_end.leg_seg[sg] || 0) + roasBySeg[sg].active, fmt.int)
    + td(sel.rev.leg_seg[sg], money) + td(roasBySeg[sg].rev, money) + td(sel.active_end.leg_seg[sg], fmt.int) + td(roasBySeg[sg].active, fmt.int) + '</tr>').join('');
  const bothTot = `<tr class="tot"><td>All clients</td>` + td(sel.rev.legacy + sel.rev.roas, money) + td(sel.active_end.legacy + sel.active_end.roas, fmt.int)
    + td(sel.rev.legacy, money) + td(sel.rev.roas, money) + td(sel.active_end.legacy, fmt.int) + td(sel.active_end.roas, fmt.int) + '</tr>';
  const bothTable = `<div class="card" style="margin-top:16px"><p class="eyebrow">Both models · by size (one axis)</p>
    <div class="tblwrap"><table class="t"><thead><tr><th style="text-align:left">Segment</th><th>Revenue</th><th>Active</th><th>Commission rev</th><th>ROAS rev</th><th>Commission active</th><th>ROAS active</th></tr></thead><tbody>${bothRows}${bothTot}</tbody></table></div>
    <div class="note">Size (E/G/SME) and model (Commission/ROAS) are now independent for every client, so the two can be combined. Revenue for <b>${esc(sel.label)}</b>.</div></div>`;

  // Client list — model, segment/tier, revenue, ROAS level (standard ladder) and ROAS factor
  // Commission: L = latest-month commission (USD) / 1000; ROAS factor = GMV / commission.
  // ROAS: L = ladder level; ROAS factor = ROAS Target at that level from the mapping sheet (live).
  const clients = [];
  D.merchants.forEach(m => {
    if ((m.rev_ttm || 0) <= 0) return;
    const e = mtCommTTM(m.name);                         // TTM-window commission + GMV from the data pack
    const avgComm = (e && e.c && e.n) ? e.c / e.n : null; // average monthly commission (USD)
    clients.push({ name: m.name, model: 'Commission', seg: m.segment, segOnly: m.segment, rev: m.rev_ttm, perf: !!(e && e.perf),
      level: avgComm ? Math.round(avgComm / 1000) : null,
      factor: (e && e.g && e.c) ? e.g / e.c : null });
  });
  D.roas_brands.forEach(b => {
    if (!['Existing', 'New', 'Reactivated'].includes(b.status_monthly ? b.status_monthly[kEnd] : b.status)) return;
    const Lcur = (typeof b.level === 'number') ? b.level : (parseInt(String(b.level).replace(/[^0-9]/g, ''), 10) || null);
    const Lnum = (b.level_monthly && b.level_monthly[kEnd] != null) ? b.level_monthly[kEnd] : Lcur;   // level reached by the period end
    clients.push({ name: b.name, model: 'ROAS', seg: (b.segment || 'SME') + (b.segment_confidence === 'U.D' ? ' · U.D' : '') + ' · ' + (b.tier || '—'), segOnly: b.segment || 'SME', rev: b.paid_to_latest, level: Lnum, std: !!(Lnum && mtRoasFactorIsStd(b.name, Lnum)),
      factor: mtRoasFactor(b.name, Lnum), migrated: b.migrated });
  });
  const show = clients.filter(c => model === 'all' || c.model.toLowerCase() === model).sort((a, b) => (b.rev || 0) - (a.rev || 0));
  const facCell = (f, std) => f == null ? '<td class="muted">—</td>' : '<td>' + f.toFixed(1) + 'x' + (std ? ' <span class="muted small" title="no client mapping in the CSM sheet: standard ladder factor (L1 = 1×, L2 = 2×, L3 = 3× …)">std</span>' : '') + '</td>';
  const clientRows = show.map(c => `<tr><td>${esc(c.name)}${c.migrated ? '<span class="tag">migrated</span>' : ''}${c.perf ? ' <span class="muted small" title="tracked commission includes fixed-fee campaigns; ROAS factor and level use performance commission only">perf. commission</span>' : ''}</td><td>${c.model}</td><td>${c.seg || '—'}</td><td>${fmt.money(c.rev)}</td>${facCell(c.factor, c.std)}</tr>`).join('');

  // Mega tile — average Level and average ROAS factor, ROAS clients and commission clients (split E/G/SME)
  const avg = a => a.length ? a.reduce((x, y) => x + y, 0) / a.length : null;
  const roasCl = clients.filter(c => c.model === 'ROAS');
  const commCl = clients.filter(c => c.model === 'Commission');
  const bySeg = s => commCl.filter(c => c.segOnly === s);
  const megaRow = (label, cl, swv) => { const fa = cl.map(c => c.factor).filter(v => v != null); const wsum = cl.reduce((a, c) => a + (c.factor != null && c.rev ? c.rev : 0), 0); const wavg = wsum ? cl.reduce((a, c) => a + (c.factor != null && c.rev ? c.factor * c.rev : 0), 0) / wsum : null;

      const firstPay = pdates[0] || null;

    for (let i = 0; i < text.length; i++) { const c = text[i];
      if (q) { if (c === '"') { if (text[i + 1] === '"') { f += '"'; i++; } else q = false; } else f += c; }
      else { if (c === '"') q = true; else if (c === ',') { row.push(f); f = ''; } else if (c === '\n') { row.push(f); rows.push(row); row = []; f = ''; } else if (c === '\r') {} else f += c; } }
    if (f.length || row.length) { row.push(f); rows.push(row); } return rows; }
  const norm = s => String(s == null ? '' : s).trim().toLowerCase().replace(/\s+/g, ' ');
  const ck = s => String(s || '').toLowerCase().replace(/[^a-z0-9]/g, '');
  const num = s => { if (s == null) return null; s = String(s).replace(/[$,xX\s]/g, '').trim(); if (!s) return null; const v = parseFloat(s); return isNaN(v) ? null : v; };
  const mnum = s => { const m = String(s || '').match(/(\d+)/); return m ? +m[1] : null; };
  function parseMap(rows) {
    let h = -1; for (let i = 0; i < rows.length; i++) { const set = new Set(rows[i].map(norm)); if (set.has('client name') && set.has('roas target')) { h = i; break; } }
    if (h < 0) throw new Error('mapping header not found');
    const H = rows[h], col = n => H.findIndex(c => norm(c) === n);
    const cC = col('client name'), cM = col('milestone'), cB = col('budget (usd)'), cT = col('roas target');
    const map = {};
    for (const r of rows.slice(h + 1)) { const name = r[cC]; if (!name || !String(name).trim()) continue; const L = mnum(r[cM]); if (!L) continue;
      const k = ck(name); (map[k] = map[k] || { name: String(name).trim(), levels: {} }).levels[L] = { budget: num(r[cB]), roas: num(r[cT]) }; }
    return map;
  }
  async function init() {
    try { const res = await fetch(MAP_SOURCE); if (!res.ok) throw new Error('HTTP ' + res.status); MT_ROAS_MAP = parseMap(parseCSV(await res.text()));
      if (typeof renderSegmentation === 'function' && document.getElementById('page-segmentation')) renderSegmentation(); mtLiveReport('map', { ok: true, clients: Object.keys(MT_ROAS_MAP).length }); }
    catch (e) { mtLiveReport('map', { ok: false, err: String(e && e.message || e) }); /* leave MT_ROAS_MAP null; segmentation shows ROAS factor as — */ }
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();
})();

boot();
</script>
